name: Actualizar y publicar el tablero

# Se dispara solo cuando cambian los anexos del DANE o el código del tablero.
# El flujo completo del mes es: reemplazar los .xlsx en datos/ y hacer commit.
on:
  push:
    branches: [main]
    paths:
      - "datos/**"
      - "etl.py"
      - "docs/index.html"
      - "verificar.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Procesar los anexos de la GEIH
        run: python etl.py

      - name: Verificar los datos
        run: python verificar.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
